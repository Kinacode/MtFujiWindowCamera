plugins { id 'com.android.application' }
android {
 namespace 'jp.fujiwindow.camera'
 compileSdk 35
 defaultConfig { manifestPlaceholders = [appLabel:'富士窓カメラ']; applicationId 'jp.fujiwindow.camera'; minSdk 29; targetSdk 35; versionCode 15; versionName '1.7.1'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildTypes { debug { applicationIdSuffix '.preview171'; versionNameSuffix '-preview'; manifestPlaceholders = [appLabel:'富士窓カメラ 補完優先版'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.camera:camera-camera2:1.4.2'
 implementation 'androidx.camera:camera-lifecycle:1.4.2'
 implementation 'androidx.camera:camera-view:1.4.2'
 implementation 'androidx.exifinterface:exifinterface:1.4.0'
 implementation 'org.opencv:opencv:4.11.0'
 implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// LaMa ONNX weights (Apache-2.0). Download at build time; never download/upload photos at runtime.
def aiAssetFolder = layout.buildDirectory.dir("generated/aiAssets").get().asFile
def modelName = 'lama_fp32.onnx'
def modelHash = '1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6'
def checksum = { File f ->
 def md = java.security.MessageDigest.getInstance('SHA-256')
 f.withInputStream { input -> byte[] buffer = new byte[65536]; int n; while ((n = input.read(buffer)) != -1) md.update(buffer, 0, n) }
 md.digest().encodeHex().toString()
}
tasks.register('prepareNeuralModel') {
 inputs.property('modelSha256', modelHash)
 outputs.file(new File(aiAssetFolder, modelName))
 doLast {
  aiAssetFolder.mkdirs()
  aiAssetFolder.listFiles()?.findAll { it.name.endsWith(".onnx") && it.name != modelName }?.each { it.delete() }
  def destination = new File(aiAssetFolder, modelName)
  if (destination.exists() && checksum(destination) == modelHash) return
  def temporary = new File(aiAssetFolder, modelName + '.download')
  try {
   def connection = new URL('https://huggingface.co/Carve/LaMa-ONNX/resolve/c3c0c9e468934d62e79c329e35d82dd09ff8c444/lama_fp32.onnx').openConnection()
   connection.connectTimeout = 30000; connection.readTimeout = 180000
   connection.inputStream.withCloseable { input -> temporary.withOutputStream { output -> input.transferTo(output) } }
   if (checksum(temporary) != modelHash) throw new GradleException('LaMa model checksum mismatch')
   java.nio.file.Files.move(temporary.toPath(), destination.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
  } finally { temporary.delete() }
 }
}
android.sourceSets.main.assets.srcDir(aiAssetFolder)
android.packaging.jniLibs.useLegacyPackaging = true
tasks.named('preBuild').configure { dependsOn('prepareNeuralModel') }
