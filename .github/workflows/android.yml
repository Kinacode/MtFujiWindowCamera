name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: FujiWindowCamera-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  image-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            ./gradlew connectedDebugAndroidTest
            adb pull /sdcard/Android/data/jp.fujiwindow.camera/files/ui-screenshots ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FujiWindowCamera-ui
          path: ui-screenshots
          if-no-files-found: warn
