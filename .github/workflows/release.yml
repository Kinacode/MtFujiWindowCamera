name: Publish APK Release
on:
  workflow_run:
    workflows: [Android APK]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android APK workflow run ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Verify successful main build from this repository
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .head_branch == "main" and .head_repository.full_name == $repo and (.event == "push" or .event == "workflow_dispatch") and .name == "Android APK"' run.json
          echo "BUILD_SHA=$(jq -r .head_sha run.json)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: FujiWindowCamera-debug
          path: apk
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: FujiWindowCamera-ui
          path: screenshots
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
      - name: Publish downloadable APK
        run: |
          (cd apk && sha256sum app-debug.apk > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          富士窓カメラ 1.7.1 補完優先版（Android 10以上）

          `app-debug.apk`（約323MB）を開いてください。表示名は「富士窓カメラ 補完優先版」、パッケージは `jp.fujiwindow.camera.preview171`。従来版・1.7.0検証版を削除せずに比較できます。旧日記の自動移行はありません。

          最大ズームの実写10枚を基準に、細い線の残留より局所補完を優先して改修。写真を縦横に押し縮めず、重なり付きの正方形領域でLaMaを実行します。設備周辺と木のケーブル周辺を追加処理し、境界は内側でなじませます。木は住宅ぼかしから除外したまま、ケーブルと重なる葉は推定補完します。

          雲を金具として広く消す誤検出を抑え、画面端の金具も検出。周囲の既知画素が滑らかにつながる二次的な除去範囲に限り、不自然な生成物を局所補間で抑えます。山頂の既知画素・マスク外のデコード済み画素を保持し、全体の色・明るさは調整しません。写真の外部送信はありません。

          過去写真の富士日記登録、EXIF撮影日の非公開保存、公開JPEGの元EXIF/GPS除去を維持。JPEG保存時は再圧縮します。

          位置合わせや自動テストの成功は画質の保証ではありません。補完した葉・雲・隠れた山肌は推定で、残留や質感差があり得ます。元写真との比較後に保存してください。推論回数が増えており、実機の処理時間とメモリ使用は端末依存です。実写・実写の比較画像は公開リポジトリへ含めません。
          NOTES
          tag=v1.7.1-preview
          existing=$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "$BUILD_SHA" ]; then tag="$tag-${BUILD_SHA:0:7}"; fi
          published=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$published" = false ]; then echo "Already published $tag; preserving its APK and signature"; exit 0; fi
          if [ -z "$published" ]; then
            gh release create "$tag" --target "$BUILD_SHA" --title "富士窓カメラ $tag" --notes-file notes.md --draft --prerelease
          fi
          gh release upload "$tag" apk/app-debug.apk apk/SHA256SUMS.txt screenshots/*.png --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false --notes-file notes.md
