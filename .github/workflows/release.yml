name: Publish APK Release
on:
  workflow_run:
    workflows: [Android APK]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android APK workflow run ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Verify successful main build from this repository
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .head_branch == "main" and .head_repository.full_name == $repo and (.event == "push" or .event == "workflow_dispatch") and .name == "Android APK"' run.json
          echo "BUILD_SHA=$(jq -r .head_sha run.json)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: FujiWindowCamera-debug
          path: apk
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: FujiWindowCamera-ui
          path: screenshots
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
      - name: Publish downloadable APK
        run: |
          (cd apk && sha256sum app-debug.apk > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          富士窓カメラ v1.6.2（Android 10以上）

          富士日記に「過去の写真を登録」を追加。複数選択し、加工せずに登録できます。EXIF撮影日時を非公開で保持し、撮影日順に表示。EXIF撮影日がない写真は「撮影日不明」と表示します。同じ元ファイルの重複登録は避け、元ファイルは変更しません。公開コピーは位置情報・元EXIFのないJPEGです。

          残っていた左下の細い電線・右端の横金具・山と重なる中央支柱を追加処理。明るく反射するケーブルにも対応し、縦方向の補正幅を拡張。512画素の重なり付きタイルでAI補完します。提供JPEGを非公開のローカル環境で検証しましたが、細線の残りや補完痕が完全になくなることを保証するものではありません。

          Assetsの **app-debug.apk** をダウンロードして端末で開いてください。
          この窓専用の固定位置モードを追加しました。見本と同じ窓・同じズーム・縦3:4の画角なら、範囲指定をせずに加工できます。3本の電線に一致しない場合は加工を停止します。

          縦画面を基本に、撮る・編集・富士日記を下部ナビで切り替えるUIへ刷新。黒基調のカメラUIに変更し、大きな丸形シャッター・写真中心のプレビュー・短い操作ラベルを採用。、富士日記は写真・EXIF撮影日時・ひと言メモを残せる日記帳になりました。元／加工写真は日記上で同じ記録にまとめます。撮影・写真読み込み、固定マスクの局所インペイント、住宅ぼかし、半透明ガイドにも対応。AIによる一般的な物体認識は使いません。提供された3枚から定めた固定位置と軽い電線位置補正を使います。「山の重なりを補完（推定）」がONの場合は、固定設備領域内の山肌・輪郭もMI-GANニューラルネットで局所補完します。実際のAI推論はONNX Runtimeで端末内実行し、写真を送信しません。元の山肌の正確な復元ではありません。OFFなら従来の山保護を維持します。電線マスクを拡大・連続化し、重なり付きの領域ごとにAI補完して合成します。色調強調は行いません。住宅は固定領域だけぼかします。公開JPEGからGPS・元EXIFを削除し、撮影日時はアプリ内に保持します。JPEG保存時は再圧縮されます。

          旧版でEXIF削除済みの写真は撮影日を復元できないため保存日時と明示します。

          GitHub Actionsのビルド・Lint・単体テスト・Android画像処理テスト・縦画面と日記メモのUIテストが成功したAPKです。実際の窓での撮影と仕上がりは実機で確認してください。
          CIのdebug署名はローカル版や別のCI実行と異なる場合があります。署名不一致で更新できない場合、旧アプリのアンインストールが必要です（範囲設定・ガイド・日記の撮影日時データは削除されます）。
          NOTES
          if ! gh release view v1.6.2 >/dev/null 2>&1; then
            gh release create v1.6.2 --target "$BUILD_SHA" --title '富士窓カメラ v1.6.2' --notes-file notes.md --draft
          fi
          gh release upload v1.6.2 apk/app-debug.apk apk/SHA256SUMS.txt screenshots/*.png --clobber
          gh release edit v1.6.2 --draft=false --latest --notes-file notes.md
