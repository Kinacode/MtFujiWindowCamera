name: Publish APK Release
on:
  workflow_run:
    workflows: [Android APK]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android APK workflow run ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Verify successful main build from this repository
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .head_branch == "main" and .head_repository.full_name == $repo and (.event == "push" or .event == "workflow_dispatch") and .name == "Android APK"' run.json
          echo "BUILD_SHA=$(jq -r .head_sha run.json)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: FujiWindowCamera-debug
          path: apk
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: FujiWindowCamera-ui
          path: screenshots
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
      - name: Publish downloadable APK
        run: |
          (cd apk && sha256sum app-debug.apk > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          富士窓カメラ 1.7.0 検証版（Android 10以上）

          `app-debug.apk` をダウンロードして開いてください。モデル内蔵のため約320MBです。`jp.fujiwindow.camera.preview` という別アプリとして入り、従来版と富士日記のデータを残したまま比較できます。

          提供された実写10枚（縦9・横1）を基準に、近い電線と奥の支柱の位置合わせを分離。上部3本の曲線を個別追跡し、横位置や大きな上下差にも対応します。MI-GANからLaMaへ切り替え、鉄塔・中央設備には周辺を含む追加処理を行います。JPEGで線の周辺に広がる跡も処理範囲へ含めます。木はぼかさず、建物の輪郭を残して内側をぼかします。

          写真を外部へ送りません。既知のマスク外のデコード済み画素は保持し、全体の彩度・色温度・明るさを調整しません。「山の重なりを補完（推定）」ON時の隠れた山肌は推定で、真の復元ではありません。JPEG保存では再圧縮が発生します。

          富士日記への過去写真の複数登録、EXIF撮影日時の非公開保存も維持しています。旧アプリの日記をこの検証版へ自動移行するものではありません。

          実写の位置合わせ・画素保持・目視評価と、Android上の実モデル／UI／EXIFの回帰テストを分けて確認します。元写真と加工結果を比較してください。元画像・実写の比較画像は公開ソースへ含めません。
          NOTES
          if ! gh release view v1.7.0-preview >/dev/null 2>&1; then
            gh release create v1.7.0-preview --target "$BUILD_SHA" --title '富士窓カメラ v1.7.0-preview' --notes-file notes.md --draft --prerelease
          fi
          gh release upload v1.7.0-preview apk/app-debug.apk apk/SHA256SUMS.txt screenshots/*.png --clobber
          gh release edit v1.7.0-preview --draft=false --prerelease --latest=false --notes-file notes.md
